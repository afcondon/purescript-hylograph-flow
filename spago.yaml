workspace:
  packageSet:
    registry: 77.13.1
  extraPackages: {}

package:
  name: hylograph-flow
  description: >
    One shared "flow" value: items that hold values, steps that compute
    them, and wires between, with the generic projections a shared renderer
    draws from it when the payloads are erased.
  publish:
    version: 0.1.1
    license: MIT
    location:
      githubOwner: afcondon
      githubRepo: purescript-hylograph-flow
  dependencies:
    - arrays: ">=7.3.0 <8.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.Flow
    dependencies:
      - console: ">=6.1.0 <7.0.0"
      - effect: ">=4.0.0 <5.0.0"
      - exceptions: ">=6.1.0 <7.0.0"
      - integers: ">=6.0.0 <7.0.0"
      - lists: ">=7.0.0 <8.0.0"
      - quickcheck: ">=8.0.1 <9.0.0"
